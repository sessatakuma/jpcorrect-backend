---
# Pin the compose project name so volume/network names stay
# `jpcorrect-backend_*` regardless of this file's directory. Without this,
# moving the file under deploy/ would rename the project to `deploy` and
# orphan the existing postgres volumes.
name: jpcorrect-backend

services:
    postgres-prod:
        image: postgres:15-alpine
        container_name: jpcorrect-postgres-prod
        environment:
            POSTGRES_USER: jpcorrect
            # Compose interpolates this from deploy/.env (see .env.example).
            # A service `env_file` is NOT an interpolation source, so the
            # password cannot live in env/prod — only its URL-encoded copy
            # inside that file's DATABASE_URL.
            POSTGRES_PASSWORD: ${POSTGRES_PROD_PASSWORD:?set in deploy/.env}
            POSTGRES_DB: jpcorrect
        volumes:
            - postgres_prod_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U jpcorrect"]
            interval: 5s
            timeout: 5s
            retries: 5
        # Rootfs has to stay writable (initdb + PGDATA), but nothing here needs
        # to gain privileges. Verified that the entrypoint's drop to the
        # postgres user still works under this.
        security_opt:
            - no-new-privileges:true
        networks:
            - prod-net
        restart: unless-stopped

    postgres-dev:
        image: postgres:15-alpine
        container_name: jpcorrect-postgres-dev
        environment:
            POSTGRES_USER: jpcorrect
            # Same deal as prod: unique per-deployment value out of
            # deploy/.env, kept in sync with env/dev's DATABASE_URL.
            POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?set in deploy/.env}
            POSTGRES_DB: jpcorrect
        volumes:
            - postgres_dev_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U jpcorrect"]
            interval: 5s
            timeout: 5s
            retries: 5
        # Rootfs has to stay writable (initdb + PGDATA), but nothing here needs
        # to gain privileges. Verified that the entrypoint's drop to the
        # postgres user still works under this.
        security_opt:
            - no-new-privileges:true
        networks:
            - dev-net
        restart: unless-stopped

    backend-prod:
        # Wrapped with >- purely to stay under the 80-col YAML lint; this
        # folds back to a single line.
        image: >-
            ${BACKEND_PROD_IMAGE:-ghcr.io/sessatakuma/jpcorrect-backend:stable}
        container_name: jpcorrect-backend-prod
        depends_on:
            postgres-prod:
                condition: service_healthy
        env_file:
            - env/prod
        expose:
            - "8080"
        # Runtime hardening: non-root image, read-only rootfs (the app writes
        # nothing to disk; /tmp is a tmpfs), no privilege escalation.
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        networks:
            - prod-net
            - jpcorrect-shared
        labels:
            - com.centurylinklabs.watchtower.enable=true
            - com.centurylinklabs.watchtower.scope=prod
        restart: unless-stopped

    backend-dev:
        image: ${BACKEND_DEV_IMAGE:-ghcr.io/sessatakuma/jpcorrect-backend:dev}
        container_name: jpcorrect-backend-dev
        depends_on:
            postgres-dev:
                condition: service_healthy
        env_file:
            - env/dev
        expose:
            - "8080"
        # Same runtime hardening as backend-prod — dev skips the app-level
        # middlewares, so the container-level guarantees matter more here, not
        # less.
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        networks:
            - dev-net
            - jpcorrect-shared
        labels:
            - com.centurylinklabs.watchtower.enable=true
            - com.centurylinklabs.watchtower.scope=dev
        restart: unless-stopped

    # Two api-tools instances mirror the backend split: each backend talks to
    # its own api-tools over its env-net (mirroring the postgres isolation), so
    # a breaking change pushed to :dev can't bleed into prod. Both pulled from
    # GHCR — built and pushed by the API-tools repo's own CI — instead of being
    # cloned and built locally. Post local-unidic neither needs env vars (the
    # old YAHOO_API_KEY is gone — accent/furigana now come from the bundled
    # local UniDic dict).
    api-tools-prod:
        # :stable is published by the API-tools repo's CD on v*.*.* git tags,
        # multi-arch (amd64 + arm64) since API-tools#64.
        image: ${API_TOOLS_PROD_IMAGE:-ghcr.io/sessatakuma/api-tools:stable}
        container_name: jpcorrect-api-tools-prod
        expose:
            - "8000"
        # Verified on the arm64 deploy host: the OpenJTalk/UniDic dicts are
        # baked into /app/.venv and only /tmp is written at runtime, so the
        # rootfs can stay read-only.
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        networks:
            - prod-net
        labels:
            # Auto-updates with the rest of prod. API-tools#64 landed, so the
            # published tags carry a linux/arm64 entry this host can execute.
            # watchtower-prod only pulls :stable, which API-tools republishes
            # on a v*.*.* tag push, so api-tools-prod moves at release cadence
            # rather than on every main merge.
            - com.centurylinklabs.watchtower.enable=true
            - com.centurylinklabs.watchtower.scope=prod
        restart: unless-stopped

    api-tools-dev:
        # :dev is published by the API-tools repo's CD on every main push,
        # multi-arch since API-tools#64.
        image: ${API_TOOLS_DEV_IMAGE:-ghcr.io/sessatakuma/api-tools:dev}
        container_name: jpcorrect-api-tools-dev
        expose:
            - "8000"
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        networks:
            - dev-net
        labels:
            # Same deal as api-tools-prod, on the dev cadence: watchtower-dev
            # polls every 5 min, so an API-tools main merge reaches dev within
            # minutes while prod waits for a release tag.
            - com.centurylinklabs.watchtower.enable=true
            - com.centurylinklabs.watchtower.scope=dev
        restart: unless-stopped

    cloudflared:
        # Pinned (not :latest) so a tunnel-side regression can't roll in
        # unreviewed; bump deliberately.
        image: cloudflare/cloudflared:2026.7.2
        command: tunnel --config /home/nonroot/.cloudflared/config.yml run
        container_name: jpcorrect-cloudflared
        volumes:
            # Credentials (cert.pem + <uuid>.json) live on the host, gitignored,
            # owned by the container's nonroot uid.
            - ./cloudflared/creds:/home/nonroot/.cloudflared
            # Ingress config is committed to repo and bind-mounted on top of
            # the dir above, so the credentials dir stays a pure secrets-only
            # location and the routing config gets reviewed via PR.
            - ./cloudflared/config.yml:/home/nonroot/.cloudflared/config.yml:ro
        security_opt:
            - no-new-privileges:true
        networks:
            - jpcorrect-shared
        restart: unless-stopped

    # Two Watchtower instances split prod from dev via WATCHTOWER_SCOPE so each
    # only touches containers carrying the matching watchtower.scope label.
    # That lets prod and dev run on independent cadences: prod waits for an
    # off-hours window, dev keeps the tight 5-minute loop.
    watchtower-prod:
        # Pinned: :latest on a dormant project is a moving target, and this
        # container holds the docker socket. Verified working on the arm64
        # deploy host.
        image: containrrr/watchtower:1.7.1
        container_name: jpcorrect-watchtower-prod
        volumes:
            # Root-equivalent on the host — this is why the two watchtowers are
            # scope-split and nothing else mounts the socket.
            - /var/run/docker.sock:/var/run/docker.sock
            - ${HOME}/.docker/config.json:/config.json:ro
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        environment:
            # containrrr/watchtower:latest is stale (project is essentially
            # dormant) and defaults to Docker API v1.25, which modern daemons
            # (≥ v28) reject as too old. Pin to a version both sides accept.
            DOCKER_API_VERSION: "1.41"
            # Pin TZ so the WATCHTOWER_SCHEDULE cron string reads as Taipei
            # local time without UTC math (Watchtower evaluates cron in the
            # container's local TZ).
            TZ: "Asia/Taipei"
            WATCHTOWER_LABEL_ENABLE: "true"
            WATCHTOWER_SCOPE: "prod"
            # 6-field cron (sec min hour dom mon dow). Fires at 03:00:00 daily.
            # POLL_INTERVAL is ignored when SCHEDULE is set.
            WATCHTOWER_SCHEDULE: "0 0 3 * * *"
            WATCHTOWER_CLEANUP: "true"
            WATCHTOWER_INCLUDE_RESTARTING: "false"
        restart: unless-stopped

    watchtower-dev:
        image: containrrr/watchtower:1.7.1
        container_name: jpcorrect-watchtower-dev
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ${HOME}/.docker/config.json:/config.json:ro
        read_only: true
        tmpfs:
            - /tmp
        security_opt:
            - no-new-privileges:true
        environment:
            DOCKER_API_VERSION: "1.41"
            WATCHTOWER_LABEL_ENABLE: "true"
            WATCHTOWER_SCOPE: "dev"
            WATCHTOWER_POLL_INTERVAL: "300"
            WATCHTOWER_CLEANUP: "true"
            WATCHTOWER_INCLUDE_RESTARTING: "false"
        restart: unless-stopped

networks:
    prod-net:
    dev-net:
    jpcorrect-shared:
        external: true

volumes:
    postgres_prod_data:
    postgres_dev_data:
