---
services:
    postgres:
        image: postgres:15-alpine
        container_name: jpcorrect-postgres
        environment:
            POSTGRES_USER: jpcorrect
            POSTGRES_PASSWORD: jpcorrect_password
            POSTGRES_DB: jpcorrect
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U jpcorrect"]
            interval: 5s
            timeout: 5s
            retries: 5

    api-tools:
        build:
            context: ./API-tools
            dockerfile: ../docker/api-tools.Dockerfile
        container_name: jpcorrect-api-tools
        environment:
            YAHOO_API_KEY: ${YAHOO_API_KEY}
            X_API_KEY: ${API_TOOLS_KEY}
            ALLOW_ORIGINS: ${API_TOOLS_ALLOW_ORIGINS:-*}
            ALLOWED_HOSTS: ${API_TOOLS_ALLOWED_HOSTS:-*}
        expose:
            - "8000"

    backend:
        build:
            context: .
            dockerfile: docker/backend.Dockerfile
        container_name: jpcorrect-backend
        depends_on:
            - postgres
            - api-tools
        env_file:
            - .env
        ports:
            - "8080:8080"

volumes:
    postgres_data: