info:
  contact: {}
  description: Japanese language correction platform backend API
  title: jpcorrect API
  version: "1.0"
paths:
  /v1/activities/{id}:
    get:
      consumes:
      - application/json
      description: Get an activity by ID with its events
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.activityDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get an activity
      tags:
      - activities
    put:
      consumes:
      - application/json
      description: Update an activity's time, mode, theme, and corresponding events
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      - description: Activity update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.updateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.activityDetailResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an activity
      tags:
      - activities
  /v1/activities/{id}/abort:
    post:
      consumes:
      - application/json
      description: Abort an activity with an optional reason
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      - description: Abort data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.abortActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jpcorrect-backend_internal_domain.Activity'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Abort an activity
      tags:
      - activities
  /v1/dict-query:
    post:
      consumes:
      - application/json
      description: 'Look up words in JMdict (Japanese-Multilingual Dictionary). Returns
        kanji forms, furigana readings, parts of speech, and English definitions.
        Supports searching by kanji, kana, or romaji. Body convention: the inner `status`
        carries the real result code; `error` is `null` on success and populated only
        when `status != 200`.'
      parameters:
      - description: Word to look up in the dictionary
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.DictQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.DictQueryResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.ProxyErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Dictionary query
      tags:
      - api-tools
  /v1/event-attendees:
    post:
      consumes:
      - application/json
      parameters:
      - description: EventAttendee data
        in: body
        name: attendee
        required: true
        schema:
          $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
      produces:
      - application/json
      responses:
