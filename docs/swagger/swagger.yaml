basePath: /
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_api.APIToolsError:
    properties:
      code:
        example: 0
        type: integer
      message:
        example: ' '
        type: string
    type: object
  internal_api.AccentInfo:
    properties:
      accent_marking_type:
        example: 1
        type: integer
      furigana:
        example: か
        type: string
      length:
        example: 1
        type: integer
    type: object
  internal_api.Definition:
    properties:
      meanings:
        example:
        - teacher
        items:
          type: string
        type: array
      pos:
        example:
        - noun
        items:
          type: string
        type: array
    type: object
  internal_api.DictQueryRequest:
    properties:
      word:
        example: 先生
        type: string
    type: object
  internal_api.DictQueryResponse:
    properties:
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        items:
          $ref: '#/definitions/internal_api.DictQueryWordResult'
        type: array
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.DictQueryWordResult:
    properties:
      definitions:
        items:
          $ref: '#/definitions/internal_api.Definition'
        type: array
      furigana:
        example:
        - せんせい
        items:
          type: string
        type: array
      id:
        example: 1387990
        type: integer
      kanji:
        example:
        - 先生
        items:
          type: string
        type: array
    type: object
  internal_api.GuildInviteResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      token:
        type: string
    type: object
  internal_api.HeadWord:
