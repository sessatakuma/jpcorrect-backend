host: localhost:8080
info:
  contact: {}
  description: Japanese language correction platform backend API
  title: jpcorrect API
  version: "1.0"
paths:
  /v1/dict-query:
    post:
      consumes:
      - application/json
      description: 'Look up words in JMdict (Japanese-Multilingual Dictionary). Returns
        kanji forms, furigana readings, parts of speech, and English definitions.
        Supports searching by kanji, kana, or romaji. Body convention: the inner `status`
        carries the real result code; `error` is `null` on success and populated only
        when `status != 200`.'
      parameters:
      - description: Word to look up in the dictionary
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.DictQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.DictQueryResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.ProxyErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Dictionary query
      tags:
      - api-tools
  /v1/event-attendees:
    post:
      consumes:
      - application/json
      parameters:
      - description: EventAttendee data
        in: body
        name: attendee
        required: true
