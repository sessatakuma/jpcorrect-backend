      result:
        items:
          $ref: '#/definitions/internal_api.WordAccentResult'
        type: array
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.MarkAccentStreamChunk:
    properties:
      chunk:
        example: 0
        type: integer
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        items:
