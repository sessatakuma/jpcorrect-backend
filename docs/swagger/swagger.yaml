  /v1/users/init:
    post:
      consumes:
      - application/json
      description: |-
        First-login endpoint (spec §3.1.1, §6.3). The caller authenticates
        with a Supabase JWT; the middleware skips the user lookup for this
        path only and the handler creates the row from the token's sub and
        email. Idempotent: a retried or concurrent call returns the same
        profile. A new account is named after the email prefix until
        PUT /v1/users/me sets a name. If another account already owns the
        email, the request answers 409 and no row is created or linked.
      produces:
      - application/json
      responses:
        "200":
          description: The caller's profile, created or already existing
          schema:
            $ref: '#/definitions/jpcorrect-backend_internal_domain.User'
        "400":
          description: The token carries no email address
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: The email belongs to another account
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Initialize the caller's account
      tags:
      - users
