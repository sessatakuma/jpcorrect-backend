          $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an event attendee
      tags:
      - event-attendees
  /v1/event-attendees/{id}:
