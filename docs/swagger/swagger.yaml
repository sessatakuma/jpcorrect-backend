        example: 1
        type: integer
      romaji_display:
        example: hashiru
        type: string
      yomi_display:
        example: ハシ・ル
        type: string
    type: object
  internal_api.IdDetails:
    properties:
      base:
        additionalProperties: {}
        type: object
      katuyokei:
        items:
          additionalProperties: {}
          type: object
        type: array
      patternfreqorder:
        items:
          additionalProperties: {}
          type: object
        type: array
      setuzoku:
        items:
          additionalProperties: {}
          type: object
        type: array
      shojikei:
        items:
          additionalProperties: {}
          type: object
        type: array
      subcorpus:
        items:
          additionalProperties: {}
          type: object
        type: array
      subcorpus_shojikei:
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  internal_api.MarkAccentRequest:
    properties:
      render_english_furigana:
        example: false
        type: boolean
      render_katakana_furigana:
        example: false
        type: boolean
      script:
