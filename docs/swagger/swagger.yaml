basePath: /
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_api.APIToolsError:
    properties:
      code:
        example: 0
        type: integer
      message:
        example: ' '
        type: string
    type: object
  internal_api.AccentInfo:
    properties:
      accent_marking_type:
        example: 1
        type: integer
      furigana:
        example: か
        type: string
      length:
        example: 1
        type: integer
    type: object
  internal_api.Definition:
    properties:
      meanings:
        example:
        - teacher
        items:
          type: string
        type: array
      pos:
        example:
        - noun
        items:
          type: string
        type: array
    type: object
  internal_api.DictQueryRequest:
    properties:
      word:
        example: 先生
        type: string
    type: object
  internal_api.DictQueryResponse:
    properties:
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        items:
          $ref: '#/definitions/internal_api.DictQueryWordResult'
        type: array
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.DictQueryWordResult:
    properties:
      definitions:
        items:
          $ref: '#/definitions/internal_api.Definition'
        type: array
      furigana:
        example:
        - せんせい
        items:
          type: string
        type: array
      id:
        example: 1387990
        type: integer
      kanji:
        example:
        - 先生
        items:
          type: string
        type: array
    type: object
  internal_api.ErrorBody:
    properties:
      code:
        example: NOT_FOUND
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        example: record not found
        type: string
    type: object
  internal_api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_api.ErrorBody'
    type: object
  internal_api.GuildInviteResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      token:
        type: string
    type: object
  internal_api.HeadWord:
    properties:
      freq:
        example: 1234
        type: integer
      headword:
        example: 走る
        type: string
      headword_id:
        example: V.00093
        type: string
      id:
        example: 1
        type: integer
      romaji_display:
        example: hashiru
        type: string
      yomi_display:
        example: ハシ・ル
        type: string
    type: object
  internal_api.IdDetails:
    properties:
      base:
        additionalProperties: {}
        type: object
      katuyokei:
        items:
          additionalProperties: {}
          type: object
        type: array
      patternfreqorder:
        items:
          additionalProperties: {}
          type: object
        type: array
      setuzoku:
        items:
          additionalProperties: {}
          type: object
        type: array
      shojikei:
        items:
          additionalProperties: {}
          type: object
        type: array
      subcorpus:
        items:
          additionalProperties: {}
          type: object
        type: array
      subcorpus_shojikei:
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  internal_api.MarkAccentRequest:
    properties:
      render_english_furigana:
        example: false
        type: boolean
      render_katakana_furigana:
        example: false
        type: boolean
      script:
        enum:
        - hiragana
        - katakana
        - romaji
        example: hiragana
        type: string
      text:
        example: お金を稼ぐ
        type: string
    type: object
  internal_api.MarkAccentResponse:
    properties:
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        items:
          $ref: '#/definitions/internal_api.WordAccentResult'
        type: array
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.MarkAccentStreamChunk:
    properties:
      chunk:
        example: 0
        type: integer
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        items:
          $ref: '#/definitions/internal_api.WordAccentResult'
        type: array
        x-nullable: "true"
      status:
        example: 200
        type: integer
      subchunk:
        example: 0
        type: integer
    type: object
  internal_api.PublicUserProfile:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      level:
        type: integer
      name:
        type: string
      user_id:
        type: string
    type: object
  internal_api.SentenceQueryRequest:
    properties:
      id:
        example: 1387990
        type: integer
      word:
        example: 先生
        type: string
    type: object
  internal_api.SentenceQueryResponse:
    properties:
      error:
        type: string
        x-nullable: "true"
      result:
        allOf:
        - $ref: '#/definitions/internal_api.SentenceQueryWordResult'
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.SentenceQueryWordResult:
    properties:
      id:
        example: 1387990
        type: integer
      sentence:
        items:
          $ref: '#/definitions/internal_api.WordSentence'
        type: array
      word:
        example: 先生
        type: string
    type: object
  internal_api.TransferLeaderRequest:
    properties:
      new_leader_user_id:
        type: string
    required:
    - new_leader_user_id
    type: object
  internal_api.UpdateGuildRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        type: string
    type: object
  internal_api.UpdateMeRequest:
    properties:
      avatar_url:
        maxLength: 2048
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  internal_api.UsageQueryHeadWordsRequest:
    properties:
      site:
        example: NLB
        type: string
      word:
        example: 走る
        type: string
    type: object
  internal_api.UsageQueryHeadWordsResponse:
    properties:
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        items:
          $ref: '#/definitions/internal_api.HeadWord'
        type: array
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.UsageQueryIDDetailsRequest:
    properties:
      headword_id:
        example: V.00093
        type: string
      site:
        example: NLB
        type: string
    type: object
  internal_api.UsageQueryIDDetailsResponse:
    properties:
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        allOf:
        - $ref: '#/definitions/internal_api.IdDetails'
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.UsageQueryURLResponse:
    properties:
      error:
        $ref: '#/definitions/internal_api.APIToolsError'
      result:
        items:
          $ref: '#/definitions/internal_api.UsageQueryWordURL'
        type: array
        x-nullable: "true"
      status:
        example: 200
        type: integer
    type: object
  internal_api.UsageQueryWordURL:
    properties:
      url:
        example: https://nlb.ninjal.ac.jp/headword/V.00093/
        type: string
      word:
        example: 走る
        type: string
    type: object
  internal_api.WordAccentResult:
    properties:
      accent:
        items:
          $ref: '#/definitions/internal_api.AccentInfo'
        type: array
      furigana:
        example: おかね
        type: string
      kernel_absorbed:
        example: false
        type: boolean
      lexical_kernel:
        example: 0
        type: integer
      lexical_kernel_alts:
        items:
          type: integer
        type: array
      subword:
        items:
          $ref: '#/definitions/internal_api.WordAccentSubword'
        type: array
      surface:
        example: お金
        type: string
    type: object
  internal_api.WordAccentSubword:
    properties:
      furigana:
        example: かね
        type: string
      lexical_kernel:
        example: 0
        type: integer
      lexical_kernel_alts:
        items:
          type: integer
        type: array
      surface:
        example: 金
        type: string
    type: object
  internal_api.WordSentence:
    properties:
      en:
        example: I will ask the teacher.
        type: string
      jp:
        example: 先生に聞いてみます。
        type: string
    type: object
  jpcorrect-backend_internal_domain.Event:
    properties:
      activity_id:
        description: v1.2 additions (spec §2.1).
        type: string
      actual_duration:
        type: number
      created_at:
        type: string
      current_step:
        type: integer
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      event_id:
        type: string
      expected_duration:
        type: number
      kind:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.EventKind'
      mode:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.EventMode'
      note:
        type: string
      record_link:
        type: string
      recording_ended_at:
        type: string
      recording_started_at:
        type: string
      recording_started_by:
        type: string
      start_time:
        type: string
      step_durations:
        items:
          type: integer
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  jpcorrect-backend_internal_domain.EventAttendee:
    properties:
      event_attendee_id:
        type: string
      event_id:
        type: string
      joined_at:
        type: string
      left_at:
        type: string
      role:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendeeRole'
      user_id:
        type: string
    type: object
  jpcorrect-backend_internal_domain.EventAttendeeRole:
    enum:
    - member
    - emcee
    type: string
    x-enum-varnames:
    - EventAttendeeRoleMember
    - EventAttendeeRoleEmcee
  jpcorrect-backend_internal_domain.EventKind:
    enum:
    - practice
    - review
    type: string
    x-enum-varnames:
    - EventKindPractice
    - EventKindReview
  jpcorrect-backend_internal_domain.EventMode:
    enum:
    - report
    - conversation
    - review
    type: string
    x-enum-varnames:
    - EventModeReport
    - EventModeConversation
    - EventModeReview
  jpcorrect-backend_internal_domain.Guild:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      guild_id:
        type: string
      level:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  jpcorrect-backend_internal_domain.GuildAttendee:
    properties:
      guild_attendee_id:
        type: string
      guild_id:
        type: string
      joined_at:
        type: string
      left_at:
        type: string
      role:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.GuildAttendeeRole'
      user_id:
        type: string
    type: object
  jpcorrect-backend_internal_domain.GuildAttendeeRole:
    enum:
    - member
    - master
    type: string
    x-enum-varnames:
    - GuildAttendeeRoleMember
    - GuildAttendeeRoleMaster
  jpcorrect-backend_internal_domain.InviteLink:
    properties:
      created_at:
        type: string
      created_by_user_id:
        type: string
      expires_at:
        type: string
      guild_id:
        type: string
      id:
        type: string
      token:
        type: string
      ttl_seconds:
        description: |-
          TTLSeconds is a request-only option and is not a column. It is kept from
          #54 as an optional override of the default 7-day lifetime; the spec itself
          only defines the 7 days.
        type: integer
    type: object
  jpcorrect-backend_internal_domain.Mistake:
    properties:
      comment:
        type: string
      confidence:
        allOf:
        - $ref: '#/definitions/jpcorrect-backend_internal_domain.MistakeConfidence'
        description: v1.2 additions (spec §2.1).
      created_at:
        type: string
      end_offset_sec:
        type: number
      event_id:
        type: string
      fixed_text:
        type: string
      interacted_at:
        type: string
      latest_correction_source:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.MistakeCorrectionSource'
      latest_correction_text:
        type: string
      mistake_id:
        type: string
      note:
        type: string
      origin_text:
        type: string
      start_offset_sec:
        type: number
      type:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.MistakeType'
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  jpcorrect-backend_internal_domain.MistakeConfidence:
    enum:
    - low
    - medium
    - high
    type: string
    x-enum-varnames:
    - MistakeConfidenceLow
    - MistakeConfidenceMedium
    - MistakeConfidenceHigh
  jpcorrect-backend_internal_domain.MistakeCorrectionSource:
    enum:
    - initial
    - chatbot
    type: string
    x-enum-varnames:
    - MistakeCorrectionSourceInitial
    - MistakeCorrectionSourceChatbot
  jpcorrect-backend_internal_domain.MistakeType:
    enum:
    - grammar
    - vocab
    - pronunciation
    - advanced
    type: string
    x-enum-varnames:
    - MistakeTypeGrammar
    - MistakeTypeVocab
    - MistakeTypePronunciation
    - MistakeTypeAdvanced
  jpcorrect-backend_internal_domain.Transcript:
    properties:
      accent:
        items:
          type: integer
        type: array
      content:
        type: string
      created_at:
        type: string
      end_offset_sec:
        type: number
      event_id:
        type: string
      note:
        type: string
      start_offset_sec:
        type: number
      transcript_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  jpcorrect-backend_internal_domain.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      email:
        type: string
      is_email_verified:
        type: boolean
      late_streak:
        type: integer
      level:
        type: integer
      name:
        type: string
      points:
        type: integer
      role:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.UserRole'
      status:
        $ref: '#/definitions/jpcorrect-backend_internal_domain.UserStatus'
      supabase_user_id:
        description: |-
          SupabaseUserID is the Supabase Auth user UUID looked up from JWT.sub
          (spec §2.1). It is nullable: a row created before the mapping exists has
          no value yet. The unique index doubles as the lookup index. It is a UUID
          column, not text, so PostgreSQL rejects a malformed identifier.
        type: string
      timezone:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  jpcorrect-backend_internal_domain.UserRole:
    enum:
    - user
    - admin
    - staff
    type: string
    x-enum-varnames:
    - UserRoleUser
    - UserRoleAdmin
    - UserRoleStaff
  jpcorrect-backend_internal_domain.UserStatus:
    enum:
    - active
    - banned
    - suspended
    type: string
    x-enum-varnames:
    - UserStatusActive
    - UserStatusBanned
    - UserStatusSuspended
info:
  contact: {}
  description: Japanese language correction platform backend API
  title: jpcorrect API
  version: "1.0"
paths:
  /v1/dict-query:
    post:
      consumes:
      - application/json
      description: 'Look up words in JMdict (Japanese-Multilingual Dictionary). Returns
        kanji forms, furigana readings, parts of speech, and English definitions.
        Supports searching by kanji, kana, or romaji. Body convention: the inner `status`
        carries the real result code; `error` is `null` on success and populated only
        when `status != 200`.'
      parameters:
      - description: Word to look up in the dictionary
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_api.DictQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.DictQueryResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Dictionary query
      tags:
      - api-tools
  /v1/event-attendees:
    post:
      consumes:
      - application/json
      parameters:
      - description: EventAttendee data
        in: body
        name: attendee
        required: true
        schema:
          $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an event attendee
      tags:
      - event-attendees
  /v1/event-attendees/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: EventAttendee ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an event attendee
      tags:
      - event-attendees
    get:
      consumes:
      - application/json
      parameters:
      - description: EventAttendee ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an event attendee by ID
      tags:
      - event-attendees
    put:
      consumes:
      - application/json
      parameters:
      - description: EventAttendee ID
        in: path
        name: id
        required: true
        type: string
      - description: EventAttendee data
        in: body
        name: attendee
        required: true
        schema:
          $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update an event attendee
      tags:
      - event-attendees
  /v1/event-attendees/event/{event_id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event attendees by event ID
      tags:
      - event-attendees
  /v1/event-attendees/user/{user_id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jpcorrect-backend_internal_domain.EventAttendee'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event attendees by user ID
      tags:
      - event-attendees
  /v1/guild-attendees:
    post:
      consumes:
      - application/json
      parameters:
      - description: GuildAttendee data
        in: body
        name: attendee
        required: true
        schema:
          $ref: '#/definitions/jpcorrect-backend_internal_domain.GuildAttendee'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/jpcorrect-backend_internal_domain.GuildAttendee'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a guild attendee
      tags:
      - guild-attendees
  /v1/guild-attendees/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: GuildAttendee ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a guild attendee
      tags:
      - guild-attendees
    get:
      consumes:
      - application/json
      parameters:
