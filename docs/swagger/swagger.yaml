securityDefinitions:
  ApiKeyAuth:
    description: Static API key (matches CLIENT_API_KEY) for non-user-specific service
      access to the /v1 api-tools endpoints. Use this when the caller has no per-user
      identity; otherwise use BearerAuth.
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: JWT issued by the configured JWKS provider. Paste the raw token;
      the "Bearer " scheme prefix is optional (added automatically if missing).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
