---
name: Docker Build Check

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "docs/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: backend:pr-${{ github.event.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        # The runtime image is distroless (no shell), so verify the binary is
        # present by inspecting the exported filesystem instead of running sh.
        run: |
          img=backend:pr-${{ github.event.number || github.run_id }}
          cid=$(docker create "$img")
          docker export "$cid" | tar -tf - app/jpcorrect
          docker rm "$cid"
